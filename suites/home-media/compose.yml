# home-media — Docker Compose suite for a self-hosted media server
# Applications: Jellyfin (video), Navidrome (music), Audiobookshelf (audiobooks), Immich (photos)
# Optional: Transmission (BT download), Bazarr (subtitles)
#
# Usage:
#   docker compose --profile all up -d
#   docker compose --profile transmission up -d  # enable BT download
#
# All services join the mb-proxy network for reverse proxy integration.

services:
  jellyfin:
    image: jellyfin/jellyfin:10.9.11
    container_name: jellyfin
    restart: unless-stopped
    profiles: ["all", ""]
    networks: [mb-proxy]
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - /data/jellyfin/config:/config
      - /data/jellyfin/cache:/cache
      - /data/media/movies:/media/movies:ro
      - /data/media/tv:/media/tv:ro
    environment:
      - JELLYFIN_PublishedServerUrl=https://${MEDIA_DOMAIN:-media.example.com}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  navidrome:
    image: deluan/navidrome:0.53.3
    container_name: navidrome
    restart: unless-stopped
    profiles: ["all", ""]
    networks: [mb-proxy]
    ports:
      - "${NAVIDROME_PORT:-4533}:4533"
    volumes:
      - /data/navidrome:/data
      - /data/media/music:/music:ro
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_ENABLETRANSCODINGCONFIG=true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4533/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  audiobookshelf:
    image: advplyr/audiobookshelf:2.17.0
    container_name: audiobookshelf
    restart: unless-stopped
    profiles: ["all", ""]
    networks: [mb-proxy]
    ports:
      - "${AUDIOBOOKSHELF_PORT:-13378}:13378"
    volumes:
      - /data/audiobookshelf/config:/config
      - /data/audiobookshelf/metadata:/metadata
      - /data/media/audiobooks:/audiobooks
      - /data/media/podcasts:/podcasts
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:13378/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  immich:
    image: ghcr.io/immich-app/immich-server:v1.121.0
    container_name: immich-server
    restart: unless-stopped
    profiles: ["all", ""]
    networks: [mb-proxy]
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    volumes:
      - /data/immich/upload:/usr/src/app/upload
      - /data/media/photos:/usr/src/app/external
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      - IMMICH_MACHINE_LEARNING=false
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:2283/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  immich-postgres:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich-postgres
    restart: unless-stopped
    profiles: ["all", ""]
    networks: [mb-proxy]
    volumes:
      - /data/immich/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_DB=immich
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 10s
      timeout: 5s
      retries: 5

  immich-redis:
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped
    profiles: ["all", ""]
    networks: [mb-proxy]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Optional: BT download ──────────────────────────────────────────────
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3
    container_name: transmission
    restart: unless-stopped
    profiles: ["transmission"]
    networks: [mb-proxy]
    ports:
      - "${TRANSMISSION_PORT:-9091}:9091"
      - "51413:51413"
      - "51413:51413/udp"
    volumes:
      - /data/transmission/config:/config
      - /data/transmission/downloads:/downloads
      - /data/transmission/watch:/watch
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Optional: Subtitle management ──────────────────────────────────────
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.6
    container_name: bazarr
    restart: unless-stopped
    profiles: ["subtitles"]
    networks: [mb-proxy]
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    volumes:
      - /data/bazarr/config:/config
      - /data/media/movies:/movies
      - /data/media/tv:/tv
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  mb-proxy:
    external: true
    name: ${MB_PROXY_NETWORK:-mb-proxy}
