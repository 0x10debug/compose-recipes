# dev-environment — Docker Compose suite for a self-hosted development toolchain
# Applications: Gitea (git hosting), Code Server (browser IDE), Woodpecker CI, Registry
# Optional: Woodpecker CI (profile "ci"), Docker Registry (profile "registry")
#
# Usage:
#   docker compose up -d                                  # Gitea + Code Server
#   docker compose --profile ci up -d                     # add Woodpecker CI
#   docker compose --profile registry up -d               # add private registry
#   docker compose --profile ci --profile registry up -d  # everything
#
# All services join the mb-proxy network for reverse proxy integration.

services:
  gitea:
    image: gitea/gitea:1.22.3
    container_name: gitea
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [mb-proxy]
    ports:
      - "${GITEA_WEB_PORT:-3000}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - /data/gitea/data:/data
      - /data/gitea/config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea-postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__server__DOMAIN=${DEV_DOMAIN}
      - GITEA__server__SSH_DOMAIN=${DEV_DOMAIN}
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__ROOT_URL=https://${DEV_DOMAIN}/
    depends_on:
      gitea-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  gitea-postgres:
    image: postgres:16-alpine
    container_name: gitea-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [mb-proxy]
    volumes:
      - /data/gitea/postgres:/var/lib/postgresql/data
    labels:
      # Dump Gitea's database before backup runs (lib/backup-hooks.sh).
      backup.hook: "pre-post"
      backup.hook.type: "postgres"
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWORD}
      - POSTGRES_DB=gitea
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 5

  code-server:
    image: lscr.io/linuxserver/code-server:4.127.0
    container_name: code-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [mb-proxy]
    ports:
      - "${CODE_SERVER_PORT:-8443}:8443"
    volumes:
      - /data/code-server/config:/config
      - /data/gitea/data/repositories:/config/workspace/repos
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE:-UTC}
      - PASSWORD=${CODE_SERVER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost:8443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Optional: CI/CD ─────────────────────────────────────────────────────
  woodpecker:
    image: woodpeckerci/woodpecker-server:2.7.0
    container_name: woodpecker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["ci"]
    networks: [mb-proxy]
    ports:
      - "${WOODPECKER_PORT:-8000}:8000"
    volumes:
      - /data/woodpecker/data:/var/lib/woodpecker
    environment:
      - WOODPECKER_OPEN=false
      - WOODPECKER_HOST=https://${DEV_DOMAIN}
      - WOODPECKER_GITEA=true
      - WOODPECKER_GITEA_URL=https://${DEV_DOMAIN}
      - WOODPECKER_GITEA_CLIENT=${WOODPECKER_GITEA_CLIENT}
      - WOODPECKER_GITEA_SECRET=${WOODPECKER_GITEA_SECRET}
      - WOODPECKER_DATABASE_DRIVER=postgres
      - WOODPECKER_DATABASE_DATASOURCE=postgres://woodpecker:${WOODPECKER_DB_PASSWORD}@woodpecker-postgres:5432/woodpecker?sslmode=disable
    depends_on:
      woodpecker-postgres:
        condition: service_healthy
      gitea:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  woodpecker-postgres:
    image: postgres:16-alpine
    container_name: woodpecker-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["ci"]
    networks: [mb-proxy]
    volumes:
      - /data/woodpecker/postgres:/var/lib/postgresql/data
    labels:
      backup.hook: "pre-post"
      backup.hook.type: "postgres"
    environment:
      - POSTGRES_USER=woodpecker
      - POSTGRES_PASSWORD=${WOODPECKER_DB_PASSWORD}
      - POSTGRES_DB=woodpecker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woodpecker -d woodpecker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Optional: Gitea Actions runner ──────────────────────────────────────
  # Built-in CI for Gitea (alternative to Woodpecker). Registration happens
  # once, with a token from Gitea's admin UI (Site administration ->
  # Actions -> Runners -> Create runner token); see README.md runbook.
  gitea-runner:
    image: gitea/act_runner:0.2.11
    container_name: gitea-runner
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["actions"]
    networks: [mb-proxy]
    volumes:
      - /data/gitea/runner:/data
      # CI jobs build and run containers, so the runner needs a Docker API.
      # Hardening: deploy the socket-proxy suite and point
      # DOCKER_HOST=tcp://socket-proxy:2375 instead of the raw socket.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - GITEA_INSTANCE_URL=https://${DEV_DOMAIN}
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN}
      - GITEA_RUNNER_NAME=${GITEA_RUNNER_NAME:-dev-runner}
    depends_on:
      gitea:
        # Optional dependency so `--profile actions` validates standalone;
        # in production start the suite together (see README runbook).
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          # Runners execute arbitrary CI workloads; cap them hard.
          memory: 2g
          cpus: "1.5"

  # ── Optional: Private container registry ────────────────────────────────
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["registry"]
    networks: [mb-proxy]
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    volumes:
      - /data/registry/data:/var/lib/registry
      - /data/registry/auth:/auth
    environment:
      - REGISTRY_HTTP_ADDR=:5000
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  mb-proxy:
    external: true
    name: ${MB_PROXY_NETWORK:-mb-proxy}
